<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tela 1 - Login | ONG Conecta Vidas</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Configuração de Cores Alinhada ao Sistema MiauApoio (Laranja + Stone) -->
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: {
                DEFAULT: '#f97316', // orange-500 (marca MiauApoio)
                dark: '#ea580c',    // orange-600
                light: '#fff7ed',   // orange-50
              },
              secondary: {
                DEFAULT: '#292524', // stone-800
                light: '#44403c',   // stone-700
                muted: '#78716c',   // stone-500
              },
              light: '#f5f5f4',     // stone-100
            }
          }
        }
      }
    </script>

    <!-- Fonte Inter (Padrão limpo e acessível da MiauApoio) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: #f5f5f4; /* light stone-100 */
            color: #292524;
            -webkit-font-smoothing: antialiased;
        }
    </style>
</head>
<body class="flex min-h-screen flex-col items-center justify-center p-3 sm:p-6 bg-[#f5f5f4]">

    <!-- Moldura Mobile com Estilo de Card da MiauApoio -->
    <main class="w-full max-w-[390px] bg-white rounded-3xl shadow-xl shadow-stone-300/50 border border-stone-200 overflow-hidden flex flex-col min-h-[660px]">
        
        <!-- Barra de Status Mobile -->
        <div class="bg-stone-900 text-stone-200 text-[11px] px-6 py-2 flex justify-between items-center tracking-wider font-semibold">
            <span>09:41</span>
            <div class="flex items-center gap-2">
                <span>5G</span>
                <span>100%</span>
            </div>
        </div>

        <div class="p-7 flex-1 flex flex-col justify-between">
            <div>
                <!-- Identidade Visual Conecta Vidas (Paleta MiauApoio Laranja & Stone) -->
                <div class="text-center mb-7 pt-2">
                    <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-orange-50 border border-orange-200/80 text-orange-500 mb-3.5 shadow-sm">
                        <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"></path>
                        </svg>
                    </div>
                    <h1 class="text-2xl font-extrabold text-stone-900 tracking-tight">ONG Conecta Vidas</h1>
                    <p class="text-stone-600 text-xs mt-1 font-medium">Gestão Logística e Voluntariado</p>

                    <!-- Tag ODS 2 Alinhada ao Design System -->
                    <div class="inline-flex items-center gap-1.5 bg-orange-50 border border-orange-200 text-orange-800 text-[11px] font-bold px-3 py-1 rounded-full mt-3">
                        <span class="w-2 h-2 rounded-full bg-orange-500"></span>
                        <span>ODS 2 • Fome Zero</span>
                    </div>
                </div>

                <!-- Formulário de Autenticação -->
                <form onsubmit="event.preventDefault(); window.location.href='Escala.html';" class="space-y-4">
                    
                    <!-- Campo E-mail de Acesso (RNF04 - Rótulo permanente visível) -->
                    <div>
                        <label class="block text-stone-800 text-sm font-bold mb-1.5" for="email">
                            E-mail de acesso
                        </label>
                        <div class="relative">
                            <input 
                                class="w-full px-4 py-3 rounded-xl bg-stone-50 border border-stone-300 text-stone-900 text-sm font-semibold focus:border-orange-500 focus:bg-white focus:outline-none focus:ring-3 focus:ring-orange-100 transition-all" 
                                type="email" 
                                id="email" 
                                value="joao.voluntario@conectavidas.org" 
                                readonly
                            >
                        </div>
                    </div>

                    <!-- Campo Senha (RNF04 - Rótulo permanente visível) -->
                    <div>
                        <label class="block text-stone-800 text-sm font-bold mb-1.5" for="password">
                            Senha
                        </label>
                        <div class="relative">
                            <input 
                                class="w-full px-4 py-3 rounded-xl bg-stone-50 border border-stone-300 text-stone-900 text-sm font-semibold focus:border-orange-500 focus:bg-white focus:outline-none focus:ring-3 focus:ring-orange-100 transition-all tracking-widest" 
                                type="password" 
                                id="password" 
                                value="********" 
                                readonly
                            >
                        </div>
                    </div>

                    <!-- Botão de Ação Primário no Laranja da MiauApoio (RNF04 >= 44px) -->
                    <button 
                        type="submit" 
                        class="w-full bg-orange-500 hover:bg-orange-600 active:bg-orange-700 text-white font-bold py-3.5 px-4 rounded-xl min-h-[46px] shadow-md shadow-orange-500/25 transition-all text-sm tracking-wide flex items-center justify-center gap-2 cursor-pointer mt-2"
                    >
                        <span>Entrar</span>
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                    </button>

                    <!-- Rota Secundária e Acesso do Coordenador -->
                    <div class="text-center pt-2 flex flex-col items-center gap-1">
                        <a href="EsqueciSenha.html" class="text-sm font-semibold text-orange-600 hover:text-orange-700 hover:underline min-h-[40px] inline-flex items-center">
                            Esqueci minha senha
                        </a>
                        <a href="Coordenador.html" class="text-xs font-bold text-stone-500 hover:text-stone-800 hover:underline py-1 inline-flex items-center gap-1">
                            <span>Acesso do Coordenador (RF01) →</span>
                        </a>
                    </div>
                </form>
            </div>

            <!-- Rodapé Técnico Discreto -->
            <div class="border-t border-stone-100 pt-4 mt-2 text-center">
                <span class="text-[11px] text-stone-400 font-medium">Conecta Vidas • Protótipo MVP (RNF01 / RNF04)</span>
            </div>
        </div>

    </main>

</body>
</html>
