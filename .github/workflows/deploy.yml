name: Deploy Produção - GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    name: 🌐 Publicação Segura do Web App
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout do Repositório
        uses: actions/checkout@v4

      - name: 📦 Isolar Exclusivamente Artefatos de Produção Web
        run: |
          mkdir _site
          # Copiar apenas os pontos de entrada e telas da aplicação web
          cp index.html _site/
          cp Login.html _site/
          cp Escala.html _site/
          cp Confirmacao.html _site/
          cp Coordenador.html _site/
          cp EscalaConcluida.html _site/
          cp EsqueciSenha.html _site/
          
          # Copiar imagens públicas caso referenciadas diretamente pelas páginas
          if [ -d "docs/assets" ]; then
            mkdir -p _site/docs/assets
            cp docs/assets/*.png _site/docs/assets/ 2>/dev/null || true
          fi

          # Garantir que ferramentas internas, agentes, scripts e testes não vazem
          test ! -d _site/.agents
          test ! -d _site/scripts
          test ! -d _site/tests
          test ! -d _site/backlog
          test ! -f _site/AGENTS.md
          
          echo "Artefato de produção web validado com sucesso:"
          ls -la _site

      - name: ⚙️ Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: 📤 Upload do Artefato
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: 🚀 Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
