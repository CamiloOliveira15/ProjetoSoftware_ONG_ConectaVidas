name: Deploy Produção - GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    name: 🌐 Publicação Segura do Web App
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout do Repositório
        uses: actions/checkout@v4

      - name: ⚛️ Configurar Ambiente Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 🔨 Compilar Frontend React Oficial (Vite)
        run: |
          cd frontend
          npm install
          npm run build

      - name: 📦 Isolar Exclusivamente Artefatos de Produção Web
        run: |
          mkdir _site
          # Copiar a aplicação React compilada diretamente para a raiz do site
          cp -r frontend/dist/* _site/
          
          # Garantir que ferramentas internas, agentes, scripts e testes não vazem
          test ! -d _site/.agents
          test ! -d _site/scripts
          test ! -d _site/tests
          test ! -d _site/backlog
          test ! -f _site/AGENTS.md
          
          echo "Artefato de produção web validado com sucesso:"
          ls -la _site

      - name: ⚙️ Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: 📤 Upload do Artefato
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: 🚀 Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
