name: CI Pipeline - MVP ONG Conecta Vidas

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  qualidade-e-testes:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout do Repositório
        uses: actions/checkout@v4

      - name: 🐍 Configurar Ambiente Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 📦 Instalar Dependências de Teste
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: 🧪 Executar Testes Automatizados (Unitários e de Integração)
        run: |
          python -m pytest -v --tb=short

      - name: ♿ Validar Integridade e Acessibilidade dos Arquivos HTML
        run: |
          python -m pytest tests/test_interface_acessibilidade.py -v
