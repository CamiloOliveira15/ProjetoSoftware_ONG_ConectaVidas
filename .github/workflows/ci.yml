name: CI Pipeline - MVP ONG Conecta Vidas

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  qualidade-e-testes:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout do Repositório
        uses: actions/checkout@v4

      - name: 🐍 Configurar Ambiente Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 📦 Instalar Dependências de Teste e Backend
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: 🧪 Executar Suíte de Testes Automatizados (20 testes)
        run: |
          python -m pytest -v --tb=short

      - name: ⚛️ Configurar Ambiente Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 🔨 Validar Compilação do Frontend React (Vite)
        run: |
          cd frontend
          npm install
          npm run build
