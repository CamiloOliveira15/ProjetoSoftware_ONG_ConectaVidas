<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tela 1 - Login | ONG Conecta Vidas</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Configuração do Design System Conecta Vidas (Laranja + Stone) -->
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: {
                DEFAULT: '#f97316', // orange-500
                dark: '#ea580c',    // orange-600
                light: '#fff7ed',   // orange-50
              },
              secondary: {
                DEFAULT: '#292524', // stone-800
                light: '#44403c',   // stone-700
                muted: '#78716c',   // stone-500
              },
              light: '#f5f5f4',     // stone-100
            }
          }
        }
      }
    </script>

    <!-- Fonte Inter (Padrão limpo e acessível) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: #f5f5f4;
            color: #292524;
            -webkit-font-smoothing: antialiased;
        }
    </style>
</head>
<body class="flex min-h-screen flex-col items-center justify-center p-3 sm:p-6 bg-[#f5f5f4]">

    <!-- Moldura Mobile com Design Responsivo -->
    <main class="w-full max-w-[390px] bg-white rounded-3xl shadow-xl shadow-stone-300/50 border border-stone-200 overflow-hidden flex flex-col min-h-[660px]">
        
        <!-- Barra de Status Mobile -->
        <div class="bg-stone-900 text-stone-200 text-[11px] px-6 py-2 flex justify-between items-center tracking-wider font-semibold">
            <span id="relogio-topo">09:41</span>
            <div class="flex items-center gap-2">
                <span>5G</span>
                <span>100%</span>
            </div>
        </div>

        <div class="p-6 sm:p-7 flex-1 flex flex-col justify-between">
            <div>
                <!-- Identidade Visual Oficial Conecta Vidas (Laranja & Stone) -->
                <div class="text-center mb-6 pt-1">
                    <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-orange-50 border border-orange-200/80 text-orange-500 mb-3 shadow-sm">
                        <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"></path>
                        </svg>
                    </div>
                    <h1 class="text-2xl font-extrabold text-stone-900 tracking-tight">ONG Conecta Vidas</h1>
                    <p class="text-stone-600 text-xs mt-1 font-medium">Gestão Logística e Voluntariado</p>

                    <!-- Tag ODS 2 Alinhada ao Design System -->
                    <div class="inline-flex items-center gap-1.5 bg-orange-50 border border-orange-200 text-orange-800 text-[11px] font-bold px-3 py-1 rounded-full mt-2.5">
                        <span class="w-2 h-2 rounded-full bg-orange-500"></span>
                        <span>ODS 2 • Fome Zero</span>
                    </div>
                </div>

                <!-- Seletores Rápidos de Perfil de Teste (Simulação Prática) -->
                <div class="mb-4 bg-stone-50 border border-stone-200/90 rounded-2xl p-2.5">
                    <span class="block text-[10px] font-bold text-stone-500 uppercase tracking-wider mb-1.5 text-center">
                        ⚡ Perfis de Teste Rápido:
                    </span>
                    <div class="grid grid-cols-2 gap-1.5">
                        <button 
                            type="button" 
                            onclick="selecionarPerfil('voluntario');"
                            id="btn-perfil-vol"
                            class="px-2.5 py-1.5 rounded-xl text-xs font-bold bg-white text-stone-800 border-2 border-orange-500 shadow-xs flex items-center justify-center gap-1 transition-all cursor-pointer"
                        >
                            <span>🛵 João (Campo)</span>
                        </button>
                        <button 
                            type="button" 
                            onclick="selecionarPerfil('coordenador');"
                            id="btn-perfil-coord"
                            class="px-2.5 py-1.5 rounded-xl text-xs font-semibold bg-stone-100 text-stone-600 border border-stone-200 hover:bg-white flex items-center justify-center gap-1 transition-all cursor-pointer"
                        >
                            <span>📋 Sede (Coord.)</span>
                        </button>
                    </div>
                </div>

                <!-- Formulário de Autenticação -->
                <form id="form-login" onsubmit="realizarLogin(event);" class="space-y-3.5">
                    
                    <!-- Campo E-mail de Acesso (RNF04 - Rótulo permanente visível) -->
                    <div>
                        <label class="block text-stone-800 text-sm font-bold mb-1" for="email">
                            E-mail de acesso
                        </label>
                        <div class="relative">
                            <input 
                                class="w-full px-4 py-3 rounded-xl bg-stone-50 border border-stone-300 text-stone-900 text-sm font-semibold focus:border-orange-500 focus:bg-white focus:outline-none focus:ring-3 focus:ring-orange-100 transition-all" 
                                type="email" 
                                id="email" 
                                name="email"
                                value="joao.voluntario@conectavidas.org" 
                                required
                                autocomplete="username"
                            >
                        </div>
                    </div>

                    <!-- Campo Senha (RNF04 - Rótulo permanente visível) -->
                    <div>
                        <div class="flex justify-between items-center mb-1">
                            <label class="block text-stone-800 text-sm font-bold" for="password">
                                Senha
                            </label>
                            <a href="EsqueciSenha.html" class="text-xs font-semibold text-orange-600 hover:text-orange-700 hover:underline">
                                Esqueci a senha
                            </a>
                        </div>
                        <div class="relative">
                            <input 
                                class="w-full px-4 py-3 pr-11 rounded-xl bg-stone-50 border border-stone-300 text-stone-900 text-sm font-semibold focus:border-orange-500 focus:bg-white focus:outline-none focus:ring-3 focus:ring-orange-100 transition-all" 
                                type="password" 
                                id="password" 
                                name="password"
                                value="12345678" 
                                required
                                autocomplete="current-password"
                            >
                            <button 
                                type="button" 
                                onclick="alternarVisibilidadeSenha();" 
                                class="absolute right-3 top-1/2 -translate-y-1/2 text-stone-400 hover:text-stone-700 p-1"
                                aria-label="Mostrar ou ocultar senha"
                            >
                                <svg id="icone-olho" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
                            </button>
                        </div>
                    </div>

                    <!-- Botão de Ação Primário no Laranja Institucional (RNF04 >= 44px) -->
                    <button 
                        type="submit" 
                        id="btn-entrar"
                        class="w-full bg-orange-500 hover:bg-orange-600 active:bg-orange-700 text-white font-bold py-3.5 px-4 rounded-xl min-h-[46px] shadow-md shadow-orange-500/25 transition-all text-sm tracking-wide flex items-center justify-center gap-2 cursor-pointer mt-2"
                    >
                        <span id="texto-btn-entrar">Entrar no Sistema</span>
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                    </button>

                    <!-- Mensagem de Feedback de Login -->
                    <div id="msg-autenticando" class="hidden text-center text-xs text-orange-700 font-bold bg-orange-50 border border-orange-200 py-2 rounded-xl animate-pulse">
                        Autenticando e carregando rota...
                    </div>
                </form>
            </div>

            <!-- Rodapé Técnico Discreto -->
            <div class="border-t border-stone-100 pt-3 mt-2 text-center">
                <span class="text-[11px] text-stone-400 font-medium">Conecta Vidas • Protótipo MVP (RNF01 / RNF04)</span>
            </div>
        </div>

    </main>

    <script>
        let destinoLogin = 'Escala.html';

        function selecionarPerfil(tipo) {
            const emailInput = document.getElementById('email');
            const passInput = document.getElementById('password');
            const btnVol = document.getElementById('btn-perfil-vol');
            const btnCoord = document.getElementById('btn-perfil-coord');
            const textoBtn = document.getElementById('texto-btn-entrar');

            if (tipo === 'voluntario') {
                emailInput.value = 'joao.voluntario@conectavidas.org';
                passInput.value = '12345678';
                destinoLogin = 'Escala.html';
                btnVol.className = 'px-2.5 py-1.5 rounded-xl text-xs font-bold bg-white text-stone-800 border-2 border-orange-500 shadow-xs flex items-center justify-center gap-1 transition-all cursor-pointer';
                btnCoord.className = 'px-2.5 py-1.5 rounded-xl text-xs font-semibold bg-stone-100 text-stone-600 border border-stone-200 hover:bg-white flex items-center justify-center gap-1 transition-all cursor-pointer';
                textoBtn.innerText = 'Entrar como Voluntário';
            } else {
                emailInput.value = 'maria.coordenadora@conectavidas.org';
                passInput.value = 'admin123';
                destinoLogin = 'Coordenador.html';
                btnCoord.className = 'px-2.5 py-1.5 rounded-xl text-xs font-bold bg-white text-stone-800 border-2 border-orange-500 shadow-xs flex items-center justify-center gap-1 transition-all cursor-pointer';
                btnVol.className = 'px-2.5 py-1.5 rounded-xl text-xs font-semibold bg-stone-100 text-stone-600 border border-stone-200 hover:bg-white flex items-center justify-center gap-1 transition-all cursor-pointer';
                textoBtn.innerText = 'Entrar como Coordenador';
            }
        }

        function alternarVisibilidadeSenha() {
            const passInput = document.getElementById('password');
            if (passInput.type === 'password') {
                passInput.type = 'text';
            } else {
                passInput.type = 'password';
            }
        }

        function realizarLogin(e) {
            e.preventDefault();
            const btn = document.getElementById('btn-entrar');
            const msg = document.getElementById('msg-autenticando');
            
            btn.disabled = true;
            btn.classList.add('opacity-75');
            msg.classList.remove('hidden');

            setTimeout(() => {
                window.location.href = destinoLogin;
            }, 600);
        }
    </script>

</body>
</html>
